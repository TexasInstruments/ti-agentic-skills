name: Linux SDK
group: ti-linux-sdk-skills
description: >
  Skills for the TI Processor SDK Linux on Sitara MPUs: SDK setup, kernel and U-Boot builds,
  Yocto, device tree, boot flow, deployment and diagnostics.
owners:
  - "@TexasInstruments/ti-linux-sdk-skills-maintainers"
status: active
license: BSD-3-Clause
bundles:
  bringup:
    description: "First boot: SDK setup, build, flash, serial console, boot chain"
    skills: [ti-linux-sdk-quick-start, ti-linux-sdk-setup, ti-linux-build-source, ti-linux-deploy-image, ti-linux-serial-console, ti-linux-boot-chain, ti-linux-diagnostic]
  kernel-dt:
    description: "Kernel modules and device tree work"
    skills: [ti-linux-kernel-module, ti-linux-device-tree-overlay, ti-linux-gpio-pinmux, ti-linux-customize-clocks, ti-linux-custom-board-port]
  yocto:
    description: "Yocto builds and device tree in Yocto"
    skills: [ti-linux-yocto-build, ti-linux-yocto-custom-dt]
  remote-cores:
    description: "Remote processors, PRU and K3 resource partitioning"
    skills: [ti-linux-remoteproc, ti-linux-pru, ti-linux-resource-partition]
shared:
  ti-linux-boot-chain:
    - {src: mcp-usage.md, dest: references/mcp-usage.md}
    - {src: ti-sdk-env.sh, dest: scripts/ti-sdk-env.sh}
  ti-linux-build-source:
    - {src: mcp-usage.md, dest: references/mcp-usage.md}
    - {src: ti-sdk-env.sh, dest: scripts/ti-sdk-env.sh}
