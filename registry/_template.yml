# Copy to registry/<group>.yml. One file per skill group (business unit / product area).
name: Human Readable Group Name          # shown in the catalog
group: ti-example-skills                 # must equal the file name and the skills/<group>/ folder
description: >
  One or two sentences: what these skills do and which products they cover.
owners:                                  # GitHub teams; must also appear in .github/CODEOWNERS
  - "@TexasInstruments/ti-example-skills-maintainers"
status: planned                          # planned | active | deprecated
license: BSD-3-Clause
# Optional: named subsets users can install as one Claude plugin.
bundles:
  starter:
    description: "What this subset is for"
    skills: []                           # skill names that exist under skills/<group>/
# Optional: files vendored from shared/<group>/ into individual skills by tools/sync_shared.py.
shared: {}
#  ti-example-build:
#    - {src: env.sh, dest: scripts/env.sh}
