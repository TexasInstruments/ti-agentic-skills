---
name: release
# Tag a category release as <category>/vX.Y.Z, for example ti-linux-sdk-skills/v1.0.0.
on:
  push:
    tags:
      - "ti-*-skills/v[0-9]+.[0-9]+.[0-9]+*"
permissions:
  contents: read
jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Validate
        run: python3 tools/sync_shared.py --check && python3 tools/build.py --check && python3 tools/validate.py
      - name: Package category
        run: |
          category="${GITHUB_REF_NAME%%/*}"
          test -d "skills/$category" || { echo "::error::no skills/$category for tag $GITHUB_REF_NAME"; exit 1; }
          test -f "registry/$category.yml" || { echo "::error::no registry/$category.yml"; exit 1; }
          tar -czf "${GITHUB_REF_NAME//\//-}.tar.gz" "skills/$category" "registry/$category.yml" LICENSE
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          files: "*.tar.gz"
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
