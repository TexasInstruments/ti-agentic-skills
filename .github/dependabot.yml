---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /mcp/processor-sdk-docs
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    groups:
      mcp-python-deps:
        patterns: ["*"]
    ignore:
      # mcp 2.x removed mcp.server.fastmcp; move to it deliberately, not via a bump.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /mcp/processor-sdk-docs
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
