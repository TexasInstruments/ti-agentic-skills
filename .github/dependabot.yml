---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /mcp/processor-sdk-docs
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
  - package-ecosystem: docker
    directory: /mcp/processor-sdk-docs
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
